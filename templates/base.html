<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Resume Screening{% endblock %}</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1d2330;--mut:#667085;--line:#e3e6ec;--acc:#1f6f78;--ok:#1a7f4b;--bad:#b3261e;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--card:#1d222a;--ink:#e8eaee;--mut:#98a2b3;--line:#2c333d;--acc:#4fb3bf;--ok:#4cc38a;--bad:#f2766e;--warn:#e0b04a}}
*{box-sizing:border-box}body{margin:0;font:15px/1.5 system-ui,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 20px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}
header b{font-size:16px}header a{color:var(--mut);text-decoration:none}header a:hover{color:var(--acc)}
main{max-width:1000px;margin:24px auto;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:16px}
label{display:block;font-weight:600;margin:12px 0 4px}
textarea,select,input[type=file],input[type=text]{width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
textarea{min-height:170px}
button{background:var(--acc);color:#fff;border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:600;cursor:pointer}
button.ok{background:var(--ok)}button.bad{background:var(--bad)}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid var(--line)}
.t-ok{color:var(--ok)}.t-bad{color:var(--bad)}.t-warn{color:var(--warn)}
.flash{background:#fff4e5;color:#7a4b00;border:1px solid #f5d9a8;padding:10px 14px;border-radius:8px;margin-bottom:12px}
.muted{color:var(--mut);font-size:13px}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top;font-size:14px}
.score{font-size:28px;font-weight:700}.row{display:flex;gap:16px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.notice{border-left:4px solid var(--warn);background:var(--bg);padding:10px 14px;border-radius:6px;font-size:13px}
.bar{height:8px;background:var(--line);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
</style></head><body>
<header><b>Resume Screening</b><a href="{{ url_for('index') }}">Screen</a><a href="{{ url_for('review_log') }}">Review log</a><a href="{{ url_for('about') }}">About &amp; limits</a></header>
<main>
{% for m in get_flashed_messages() %}<div class="flash">{{ m }}</div>{% endfor %}
{% block body %}{% endblock %}
</main></body></html>
